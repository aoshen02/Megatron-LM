[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemorl-mlite"
version = "0.1.0"
description = "NeMo-RL policy worker and vLLM refit extension backed by Megatron Lite"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["nemorl_mlite", "nemorl_mlite.*"]
