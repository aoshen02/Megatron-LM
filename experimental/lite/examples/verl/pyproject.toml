[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-mlite"
version = "0.1.0"
description = "VERL engine backend 'mlite' backed by Megatron Lite"
requires-python = ">=3.10"

# Installs only the verl_mlite package. The examples' process-wide
# sitecustomize.py patch hook is not part of the installed distribution.
[tool.setuptools.packages.find]
where = ["."]
include = ["verl_mlite", "verl_mlite.*"]

[tool.setuptools.package-data]
"verl_mlite.config" = ["**/*.yaml"]
