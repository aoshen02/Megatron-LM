[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megatron-lite"
version = "0.1.0"
description = "Megatron Lite: composable model protocols and runtime on Megatron Core"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["megatron.lite", "megatron.lite.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]
